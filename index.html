<!DOCTYPE HTML>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Time</title>
    <link rel="icon" href="images/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
  </head>

<body>
  <!-- шапка -->
  <header class="TitleTime">
    <h1 id="BSODTime">Moscow Time</h1>
  <!-- кнопка темы -->
    <div id="Btn-Them">
      <button class="Btn" id="BtnTheme" style="cursor: pointer;"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-moon-icon lucide-sun-moon"><path d="M12 2v2"/><path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715"/><path d="M16 12a4 4 0 0 0-4-4"/><path d="m19 5-1.256 1.256"/><path d="M20 12h2"/></svg></button>
    </div>
  </header>

  <Main>
    <!-- часы - таймер -->
    <div class="Time-Container">
      <div class="Clock-Container">
        <Span id="Clock">00:00:00</Span><span id="ClocMs">:000</span>
      </div>
      <div class="Data-Container">
        <data id="Data">00.00.0000</data>
      </div>
    </div>

    <!-- модальное окно -->
    <div class="Modal-Overlay" id="ModalOverlay">
      <div id="ModalContent">
          <button class="close-btn" id="CloseBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6.707 5.293l5.293 5.292l5.293 -5.292a1 1 0 0 1 1.414 1.414l-5.292 5.293l5.292 5.293a1 1 0 0 1 -1.414 1.414l-5.293 -5.292l-5.293 5.292a1 1 0 1 1 -1.414 -1.414l5.292 -5.293l-5.292 -5.293a1 1 0 0 1 1.414 -1.414" /></svg>
          </button>
          <h2 id="TimeSet">установка таймера</h2>
          <!-- кнопки теста -->
          <div class="Test">
            <button class="Test10s" id="test-10s"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-test-pipe-2"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M16 2a1 1 0 0 1 0 2v14a4 4 0 1 1 -8 0v-14a1 1 0 1 1 0 -2zm-2 2h-4v7h4z" /></svg>тест на 10 сек</button>
            <button class="Test1min" id="test-1min"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-flask-2"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M15 2a1 1 0 0 1 0 2v5.674l.062 .03a7 7 0 0 1 3.85 5.174l.037 .262a7 7 0 0 1 -3.078 6.693a1 1 0 0 1 -.553 .167h-6.635a1 1 0 0 1 -.552 -.166a7 7 0 0 1 .807 -12.134l.062 -.028v-5.672a1 1 0 1 1 0 -2h6zm-2 2h-2v6.34a1 1 0 0 1 -.551 .894l-.116 .049a5 5 0 0 0 -2.92 2.717h9.172a5 5 0 0 0 -2.918 -2.715a1 1 0 0 1 -.667 -.943v-6.342z" /></svg>тест на 1 минуту</button>
            <button class="Test10min" id="test-10min"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-flask"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M15 2a1 1 0 0 1 0 2v4.826l3.932 10.814l.034 .077a1.7 1.7 0 0 1 -.002 1.193l-.07 .162a1.7 1.7 0 0 1 -1.213 .911l-.181 .017h-11l-.181 -.017a1.7 1.7 0 0 1 -1.285 -2.266l.039 -.09l3.927 -10.804v-4.823a1 1 0 1 1 0 -2h6zm-2 2h-2v4h2v-4z" /></svg>тест на 10 минут</button>
          </div>
          <div id="Input">
            <!-- Name input -->
            <div>
              <p class="InputP"><a>Имя </a><input type="text"></p>
            </div>
            <!-- Time input -->
            <div>
              <p class="InputP"><a>Время</a><input type="time" class="TimeInput" name="time"></p>
            </div>
            <!-- Data input -->
            <div>
              <p class="InputP"><a>Дата </a><input type="date" class="DataInput" name="data"><a> без даты </a><input type="checkbox" class="DataCheck"></p>
            </div>
            <!-- repeat input -->
            <div>
              <p class="InputP"><a>повтор</a><input type="checkbox" class="CheckboxRepeat" name="repeat"></p>
            </div>
            <button class="Btn" id="AddTimeBtn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package-plus-icon lucide-package-plus"><path d="M12 22V12"/><path d="M16 17h6"/><path d="M19 14v6"/><path d="M21 10.535V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.729l7 4a2 2 0 0 0 2 .001l1.675-.955"/><path d="M3.29 7 12 12l8.71-5"/><path d="m7.5 4.27 8.997 5.148"/></svg>Добавить в базу</button>
            <button class='Btn'><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-ccw-icon lucide-refresh-ccw"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>обновить</button>
            <!-- Таблица данных с GitHub -->
            <table class="TbeGit" id="TbeGitGists">
              <thead id="TbeHead">
                <tr>
                  <th id="NumberTH">№</th>
                  <th id="NameTH">Имя</th>
                  <th id="TimeTH">Время</th>
                  <th id="DataTH">Дата</th>
                  <th id="Repeat">Повтор</th>
                  <th id="BtnTH">Кнопочки</th>
                </tr>
              </thead>
              <tbody id="GitGists">
                <!-- здеся данные -->
                 <tr><td colspan="5" style="text-align:center;">Загрузка...</td></tr>
              </tbody>
            </table>
          </div>
      </div>
    </div>
  </Main>

  <!-- футер -->
  <footer>
    <div id="copyright">
       <button class="Btn" id="BtnTimer">&copy; <span id="CurrentYear"></span> :)</button>
    </div>
    <div id="Avtors">
      <p>by <a class="AvtorURL" href="https://github.com/ZaxarRZG" target="_blank">ZaharRZG</a> & <a class="AvtorURL" href="https://github.com/V1tamin4ik" target="_blank">V1tamin4ik</a></p>
    </div>
    <a href="https://github.com/ZaxarRZG/BSDO-Time" id="BtnRepos" target="_blank"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brand-github"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5" /></svg></a>
  </footer>


  <!-- основной скрипт -->
    <script src="JavaScript/Script.js" defer></script>
  <!-- скрипт изменения темы -->
    <script src="JavaScript/Theme.js" defer></script>
  <!-- модальное окно -->
    <script src="JavaScript/Modal.js" defer></script>
  <!-- GitHu API  -->
    <script src="JavaScript/GithubAPI.js" defer></script>
  <!-- автоматическая смена года -->    
    <script defer> 
      document.getElementById('CurrentYear').textContent = new Date().getFullYear();
    </script>

</body>
</html>
