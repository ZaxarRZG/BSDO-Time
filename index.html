<!DOCTYPE HTML>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Time</title>
    <link rel="icon" href="images/gold-clock-icon-free-png.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
  </head>

<body>
  <!-- шапка -->
  <header class="TitleTime">
    <h1 id="BSODTime">BSOD Time</h1>
    <button class="Btn" id="BtnTimer"></button>
  <!-- кнопка темы -->
    <div id="Btn-Them">
      <button class="Btn" id="BtnThem"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-moon-icon lucide-sun-moon"><path d="M12 2v2"/><path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715"/><path d="M16 12a4 4 0 0 0-4-4"/><path d="m19 5-1.256 1.256"/><path d="M20 12h2"/></svg></button>
    </div>
  </header>

  <!-- контент -->
  <Main>
    <div class="Clock-Container" id="Clock">00:00:00:000</div>
    <data class="Data-Container" id="Data">00.00.0000</data>
  </Main>

  <!-- футер -->
  <footer>
    <div id="copyright">
      &copy; <span id="CurrentYear"></span> :)
    </div>
    <div id="Avtors">
      <p>by <a href="https://github.com/ZaxarRZG" target="_blank">ZaharRZG</a> & 
      <a href="https://github.com/V1tamin4ik" target="_blank">V1tamin4ik</a></p>
    </div>
    <a href="https://github.com/ZaxarRZG/BSDO-Time" id="BtnRepos" target="_blank"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brand-github"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5" /></svg></a>
  </footer>

  <!-- основной скрипт -->
    <script src="Script.js" defer></script>
  <!-- скрипт изменения темы -->
    <script src="Theme.js" defer></script>
  <!-- автоматическая смена года -->    
    <script defer> 
      document.getElementById('CurrentYear').textContent = new Date().getFullYear();
    </script>

</body>
</html>
