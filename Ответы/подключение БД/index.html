<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSOD Timer</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #3ECF8E;
            border: none;
            color: white;
            border-radius: 5px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background: #2FA870;
        }
        #output {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            min-height: 20px;
            word-wrap: break-word;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>💀 BSOD Timer</h1>
    
    <input type="text" id="textInput" placeholder="Введите текст для сохранения...">
    <br>
    <button onclick="saveData()">💾 Сохранить</button>
    <button onclick="loadData()">📥 Загрузить</button>
    
    <div id="output">Нажмите "Загрузить" чтобы получить данные</div>
    <div id="status" class="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Глобальные переменные
        var SUPABASE_URL = '';
        var SUPABASE_KEY = '';
        var client = null;
        
        // Инициализация Supabase
        function initSupabase() {
            if (!client && window.supabase) {
                client = window.supabase.createClient(supabaseUrl, supabaseKey);
            }
        }
        
        // Загрузка данных
        async function loadData() {
            var statusEl = document.getElementById('status');
            var outputEl = document.getElementById('output');
            
            try {
                initSupabase();
                
                if (!client) {
                    throw new Error('Supabase не инициализирован');
                }
                
                statusEl.textContent = 'Загрузка...';
                statusEl.className = 'status';
                
                var result = await client
                    .from('BSOD_timer')
                    .select('value')
                    .single();
                
                if (result.error) throw result.error;
                
                outputEl.textContent = result.data.value || 'Пусто';
                statusEl.textContent = '✅ Данные загружены!';
                statusEl.className = 'status success';
                
            } catch (err) {
                console.error('Ошибка:', err);
                statusEl.textContent = '❌ Ошибка: ' + err.message;
                statusEl.className = 'status error';
            }
        }
        
        // Сохранение данных
        async function saveData() {
            var textInput = document.getElementById('textInput');
            var statusEl = document.getElementById('status');
            
            if (!textInput.value.trim()) {
                statusEl.textContent = '⚠️ Введите текст!';
                statusEl.className = 'status error';
                return;
            }
            
            try {
                initSupabase();
                
                if (!client) {
                    throw new Error('Supabase не инициализирован');
                }
                
                statusEl.textContent = 'Сохранение...';
                statusEl.className = 'status';
                
                var result = await client
                    .from('BSOD_timer')
                    .update({ value: textInput.value })
                    .eq('id', 1);
                
                if (result.error) throw result.error;
                
                statusEl.textContent = '✅ Сохранено!';
                statusEl.className = 'status success';
                
                textInput.value = '';
                
            } catch (err) {
                console.error('Ошибка:', err);
                statusEl.textContent = '❌ Ошибка: ' + err.message;
                statusEl.className = 'status error';
            }
        }
        
        // Загружаем данные при старте страницы
        window.addEventListener('load', function() {
            initSupabase();
            loadData();
        });
    </script>
</body>
</html>
