<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSOD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: default;
        }

        .main-message {
            font-size: 28px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .percent-container {
            font-size: 28px;
            text-align: center;
            margin-bottom: 60px;
            min-height: 40px;
        }

        .footer {
            position: fixed;
            bottom: 40px;
            text-align: center;
            font-size: 14px;
            color: #fff;
        }

        .footer .stop-code {
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <div class="main-message">
        Your device ran into a problem and needs to restart.
    </div>

    <div class="percent-container">
        <span id="percent">0</span>% complete
    </div>

    <div class="footer">
        <div class="stop-code">Stop code: DRIVER_IRQL_NOT_LESS_OR_EQUAL (0xD1)</div>
        <div class="stop-code">What failed: myfault.sys</div>
    </div>

    <script>
        (function () {
            const percentEl = document.getElementById("percent");
            let current = 0;

            function tick() {
                if (current >= 100) {
                    percentEl.textContent = 100;
                    // Возврат на предыдущую страницу
                    setTimeout(function () {
                        if (window.history.length > 1) {
                            window.history.back();
                        } else {
                            window.location.href = "/";
                        }
                    }, 600);
                    return;
                }

                // Случайный шаг от 0 до 3
                const step = Math.floor(Math.random() * 3);
                current += step;
                if (current > 100) current = 100;

                percentEl.textContent = current;

                // Скорость меняется случайным образом (200–800 мс)
                const delay = 200 + Math.random() * 600;
                setTimeout(tick, delay);
            }

            // Начать через 1.5 секунды
            setTimeout(tick, 1500);
        })();
    </script>
</body>
</html>
